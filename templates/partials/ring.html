{# 24-uurs dagring: 00:00 bovenaan, met de klok mee. pathLength=100 zodat dasharray in procenten werkt. #}
<div class="ringwrap" data-now-pct="{{ now_pct }}">
  <svg viewBox="0 0 200 200" class="ringsvg" role="img" aria-label="Dagring">
    <defs>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g transform="rotate(-90 100 100)">
      <circle class="ring-track" cx="100" cy="100" r="80" pathLength="100"/>
      <circle class="ring-elapsed" id="ring-elapsed" cx="100" cy="100" r="80" pathLength="100"
              stroke-dasharray="{{ now_pct }} {{ 100 - now_pct }}"/>
      {% for s in segments %}
      <circle class="ring-seg src-{{ s.source }}{% if s.past %} past{% endif %}{% if s.current %} current{% endif %}"
              cx="100" cy="100" r="80" pathLength="100"
              stroke-dasharray="{{ s.length }} {{ 100 - s.length }}" stroke-dashoffset="{{ -s.start }}">
        <title>{{ s.title }}</title>
      </circle>
      {% endfor %}
    </g>
    {# uurtikken #}
    {% for h in [0, 6, 12, 18] %}
    <line class="ring-hour" x1="100" y1="12" x2="100" y2="17" transform="rotate({{ h * 15 }} 100 100)"/>
    {% endfor %}
    {% for t in ticks %}
    <g transform="rotate({{ t.at * 3.6 }} 100 100)">
      <line class="ring-tick {{ t.kind }}" x1="100" y1="6" x2="100" y2="16"><title>{{ t.title }}</title></line>
    </g>
    {% endfor %}
    <g id="ring-hand" transform="rotate({{ now_pct * 3.6 }} 100 100)">
      <line class="ring-now" x1="100" y1="10" x2="100" y2="30" filter="url(#glow)"/>
    </g>
    <text class="ring-time" x="100" y="96" text-anchor="middle" id="ring-clock">{{ now | time }}</text>
    <text class="ring-sub" x="100" y="114" text-anchor="middle">{{ events_done }}/{{ events_total }} afspraken</text>
    <text class="ring-sub small" x="100" y="128" text-anchor="middle" id="ring-pct">{{ now_pct | round | int }}% van de dag</text>
  </svg>
</div>
